name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 配置、测试与 Shell 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装 Python 开发依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 校验配置
        run: make validate

      - name: 运行单元测试
        run: make test

      - name: 安装 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: 设置 Go（安装 shfmt）
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: 安装 shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0

      - name: Bash 语法、ShellCheck 与 shfmt
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint
